orrect\\\x22: false\x7d, \x7b\\\x22text\\\x22: \\\x22Bảo mật (Security)\\\x22, \\\x22correct\\\x22: false\x7d\x5d, \\\x22fb\\\x22: \\\x22Scalability là khả năng mạng mở rộng nhanh chóng để hỗ trợ người dùng và dịch vụ mới.\\\x22\x7d, \x7b\\\x22id\\\x22: 3, \\\x22topic\\\x22: \\\x22Networking Today\\\x22, \\\x22prompt\\\x22: \\\x22BYOD (Bring Your Own Device) đề cập đến xu hướng nào?\\\x22, \\\x22options\\\x22: \x5b\x7b\\\x22text\\\x22: \\\x22Cấm nhân viên mang thiết bị cá nhân vào công ty\\\x22, \\\x22correct\\\x22: false\x7d, \x7b\\\x22text\\\x22: \\\x22Cho phép người dùng dùng thiết bị cá nhân để truy cập mạng và tài nguyên công ty\\\x22, \\\x22correct\\\x22: true\x7d, \x7b\\\x22text\\\x22: \\\x22Chỉ dùng thiết bị của công ty cấp\\\x22, \\\x22correct\\\x22: false\x7d, \x7b\\\x22text\\\x22: \\\x22Một giao thức định tuyến\\\x22, \\\x22correct\\\x22: false\x7d\x5d, \\\x22fb\\\x22: \\\x22BYOD là xu hướng cho phép người dùng sử dụng thiết bị cá nhân (laptop, điện thoại...) để kết nối vào mạng doanh nghiệp.\\\x22\x7d, \x7b\\\x22id\\\x22: 4, \\\x22topic\\\x22: \\\x22Networking Today\\\x22, \\\x22prompt\\\x22: \\\x22Điện toán đám mây (cloud computing) cho phép người dùng làm gì?\\\x22, \\\x22options\\\x22: \x5b\x7b\\\x22text\\\x22: \\\x22Chỉ lưu trữ dữ liệu offline\\\x22, \\\x22correct\\\x22: false\x7d, \x7b\\\x22text\\\x22: \\\x22Truy cập tài nguyên tính toán, lưu trữ và ứng dụng qua Internet\\\x22, \\\x22correct\\\x22: true\x7d, \x7b\\\x22text\\\x22: \\\x22Loại bỏ hoàn toàn nhu cầu kết nối mạng\\\x22, \\\x22correct\\\x22: false\x7d, \x7b\\\x22text\\\x22: \\\x22Chỉ dùng cho mạng nội bộ (LAN)\\\x22, \\\x22correct\\\x22: false\x7d\x5d, \\\x22fb\\\x22: \\\x22Cloud computing cho phép truy cập tài nguyên (server, phần mềm, lưu trữ) qua Internet mà không cần sở hữu hạ tầng vật lý.\\\x22\x7d, \x7b\\\x22id\\\x22: 5, \\\x22topic\\\x22: \\\x22Networking Today\\\x22, \\\x22prompt\\\x22: \\\x22Mạng hội tụ (converged network) là gì?\\\x22, \\\x22options\\\x22: \x5b\x7b\\\x22text\\\x2
